              - generic [ref=f2e94]:
                - 'heading "FullStack Monitoring with Open Telemetry: End-to-End Observability for Modern Applications en es pt" [level=3] [ref=f2e95]':
                  - 'link "FullStack Monitoring with Open Telemetry: End-to-End Observability for Modern Applications" [ref=f2e96] [cursor=pointer]':
                    - /url: /s/erickwendel/fullstack-monitoring-with-open-telemetry-end-to-en/125108
                  - generic [ref=f2e97]:
                    - generic "English" [ref=f2e98]: en
                    - generic "Spanish / Castilian" [ref=f2e99]: es
                    - generic "Portuguese" [ref=f2e100]: pt
                - paragraph [ref=f2e101]: "In this talk, I’ll show how to instrument applications end-to-end with OpenTelemetry, capturing metrics, traces, and logs across the entire request lifecycle. You’ll learn to pinpoint errors, understand why they happen, and fix them faster—guided by real-world examples and a starter template for quick adoption.You’ll also see how to turn telemetry into automated insights using MCPs (Model Context Protocol) to generate reports from your observability stack—for example, using a Grafana MCP to produce incident summaries, release health reports, and “what changed?” diagnostics with open-source tooling.Outline- Why full-stack observability matters: from browser to database- OpenTelemetry fundamentals: metrics, traces, logs, and context propagation- JavaScript + Node.js instrumentation: where to add signals (and why)- Correlation in practice: connecting errors, traces, logs, and user impact- Detecting anomalies: SLOs, alerting, and actionable dashboards- Export pipelines: OpenTelemetry Collector and common open-source backends- AI-assisted ops with MCP: generating reports from Grafana (and other tools)- A starter template + rollout strategy: incremental adoption without breaking prod"
                - paragraph
              - generic [ref=f2e107]:
                - heading "The Revolution of Embedded AI in the Browsers en es pt" [level=3] [ref=f2e108]:
                  - link "The Revolution of Embedded AI in the Browsers" [ref=f2e109] [cursor=pointer]:
                    - /url: /s/erickwendel/the-revolution-of-embedded-ai-in-the-browsers/146881
                  - generic [ref=f2e110]:
                    - generic "English" [ref=f2e111]: en
                    - generic "Spanish / Castilian" [ref=f2e112]: es
                    - generic "Portuguese" [ref=f2e113]: pt
                - paragraph [ref=f2e114]: "In this session, I’ll reveal how the web is entering a new era with AI running natively inside browsers. We’ll explore Chrome’s initiative to embed models directly in the runtime, the emerging consensus among browsers to define a common future for Web AI, and how this paves the way for a new “Web 4.0” — the agentic web. You’ll also gain insights into the latest Chrome AI APIs, see what’s already possible today, and discover how these capabilities will transform the way we build intelligent web applications.Outline- Embedded AI: Chrome’s initiative to ship models in the browser- Cross-Browser Consensus: Aligning on the future of Web AI- Web 4.0 Vision: The rise of the agentic web- Chrome AI APIs: What developers can build today- Real-World Use Cases: Practical examples of AI-powered web apps"
                - paragraph
              - generic [ref=f2e120]:
                - 'heading "Web AI Beyond Chat: Genetic Algorithms, RL, and Transformers.js on the Edge en es pt" [level=3] [ref=f2e121]':
                  - 'link "Web AI Beyond Chat: Genetic Algorithms, RL, and Transformers.js on the Edge" [ref=f2e122] [cursor=pointer]':
                    - /url: /s/erickwendel/web-ai-beyond-chat-genetic-algorithms-rl-and-trans/161593
                  - generic [ref=f2e123]:
                    - generic "English" [ref=f2e124]: en
                    - generic "Spanish / Castilian" [ref=f2e125]: es
                    - generic "Portuguese" [ref=f2e126]: pt
                - paragraph [ref=f2e127]: "Web AI isn’t just “call an LLM API.” In this talk, you’ll explore a practical toolkit for building AI features that run directly in the browser and Node.js—without per-request costs and with privacy-first defaults. You’ll go beyond chat and cover Genetic Algorithms (optimization), Reinforcement Learning (decision-making agents), and Transformers.js as a runtime for running transformer-based models in JavaScript for vision, embeddings, classification, and more. You’ll also see how to add a local knowledge layer using SQLite compiled to WebAssembly to enable RAG-style experiences fully on-device.Outline- Web AI without vendor lock-in: what’s possible today- Genetic Algorithms: fast optimization and creative search- Reinforcement Learning: agents that learn by trial and reward- Transformers.js: running transformer models in browser/Node (not just chat)- Local RAG: embeddings + retrieval + SQLite/WASM- Shipping to mobile/desktop: Workers, performance, and UX patterns"
                - paragraph
              - generic [ref=f2e133]:
                - heading "55 Hours, 770M Tokens, and One Browser-Native Canva Alternative en es pt" [level=3] [ref=f2e134]:
                  - link "55 Hours, 770M Tokens, and One Browser-Native Canva Alternative" [ref=f2e135] [cursor=pointer]:
                    - /url: /s/erickwendel/55-hours-770m-tokens-and-one-browser-native-canva-/180558
                  - generic [ref=f2e136]:
                    - generic "English" [ref=f2e137]: en
                    - generic "Spanish / Castilian" [ref=f2e138]: es
                    - generic "Portuguese" [ref=f2e139]: pt
                - paragraph [ref=f2e140]: "In this session, I’ll reveal what happens when you stop using AI as autocomplete and start treating it as a long-running engineering partner. I’ll share how I used Codex across multiple worktrees to build LocalStudio.dev, a browser-native, local-first alternative to tools like Canva and Keynote, with more than 770M logged tokens and a longest uninterrupted agent run of around 20 hours.We’ll explore the workflow behind the project: spec-driven development with Superpowers, parallel worktree-based implementation, custom Codex skills, and later end-to-end test coverage to stabilize the product. You’ll see how the project evolved from idea to working app, what broke along the way, and what I learned about using AI agents for real software engineering beyond toy demos.Outline- The Experiment: 770M logged tokens and a 20-hour uninterrupted agent run- LocalStudio.dev: building a browser-native Canva/Keynote alternative- Worktree-Based Development: running parallel Codex tasks without blocking the main project- Spec-Driven Development: using Superpowers to guide planning and implementation- Custom Skills: repeatable workflows for planning, testing, memory, and reviews- E2E Stabilization: using Playwright coverage to find bugs and harden the app- Lessons Learned: what worked, what failed, and how to run better agentic coding sessions"
                - paragraph
